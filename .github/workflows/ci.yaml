name: Backend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  INFRA_REPOSITORY: eli0504167101/Pipeline360-Infra
  BACKEND_MANIFEST: kubernetes/backend/deployment.yaml

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Validate backend JavaScript
        run: npm test

      - name: Validate required files
        run: |
          set -euo pipefail

          required_files=(
            "Dockerfile"
            ".dockerignore"
            "package.json"
            "package-lock.json"
            "src/server.js"
            "src/config/db.js"
            "src/controllers/reservationController.js"
            "src/models/Hotel.js"
            "src/models/Reservation.js"
            "src/routes/reservationRoutes.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required backend file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

  build-and-push:
    name: Build and push backend image
    needs:
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate backend image tag
        id: image
        run: |
          set -euo pipefail

          IMAGE_TAG="backend-${GITHUB_RUN_NUMBER}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Backend image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:${{ steps.image.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Open backend deployment pull request
    needs:
      - build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          fetch-depth: 0

      - name: Validate backend manifest
        run: |
          set -euo pipefail

          if [ ! -f "${BACKEND_MANIFEST}" ]; then
            echo "Backend manifest was not found: ${BACKEND_MANIFEST}"
            exit 1
          fi

          IMAGE_LINES="$(grep -c 'image: .*hotel-backend:' "${BACKEND_MANIFEST}")"

          if [ "${IMAGE_LINES}" -ne 1 ]; then
            echo "Expected exactly one hotel-backend image line, found: ${IMAGE_LINES}"
            exit 1
          fi

          echo "Current backend image:"
          grep -n 'image: .*hotel-backend:' "${BACKEND_MANIFEST}"

      - name: Update backend image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          sed -i \
            "s|image: .*hotel-backend:.*|image: ${DOCKERHUB_USERNAME}/hotel-backend:${IMAGE_TAG}|" \
            "${BACKEND_MANIFEST}"

          echo "Updated backend image:"
          grep -n 'image: .*hotel-backend:' "${BACKEND_MANIFEST}"

          if ! grep -q \
            "image: ${DOCKERHUB_USERNAME}/hotel-backend:${IMAGE_TAG}" \
            "${BACKEND_MANIFEST}"; then
            echo "Backend image tag update failed."
            exit 1
          fi

      - name: Create deployment branch
        id: deployment
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          BRANCH_NAME="deployment/backend-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${BACKEND_MANIFEST}"

          if git diff --cached --quiet; then
            echo "No backend manifest change detected."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "${BRANCH_NAME}"
          git commit -m "Update backend image to ${IMAGE_TAG}"
          git push --set-upstream origin "${BRANCH_NAME}"

          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Open pull request to main
        if: steps.deployment.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          BRANCH_NAME: ${{ steps.deployment.outputs.branch_name }}
        run: |
          set -euo pipefail

          gh pr create \
            --repo "${INFRA_REPOSITORY}" \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Deploy backend image ${IMAGE_TAG}" \
            --body "Automated backend deployment preparation.

          - Image: \`${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:${IMAGE_TAG}\`
          - Source repository: \`${GITHUB_REPOSITORY}\`
          - Source commit: \`${GITHUB_SHA}\`
          - Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This pull request requires review and approval before merge."