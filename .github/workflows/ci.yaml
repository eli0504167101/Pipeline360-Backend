name: Backend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Validate backend JavaScript
        run: npm test

      - name: Validate required files
        run: |
          set -euo pipefail

          required_files=(
            "Dockerfile"
            ".dockerignore"
            "package.json"
            "package-lock.json"
            "src/server.js"
            "src/config/db.js"
            "src/controllers/reservationController.js"
            "src/models/Hotel.js"
            "src/models/Reservation.js"
            "src/routes/reservationRoutes.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required backend file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

  docker-build:
    name: Validate backend Docker build
    needs:
      - validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image without pushing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pipeline360-backend:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max