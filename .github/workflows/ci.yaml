name: Backend CI

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths-ignore:
      - README.md
      - docs/**
      - LICENSE
      
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Validate backend JavaScript
        run: npm test

      - name: Validate required files
        run: |
          set -euo pipefail

          required_files=(
            "Dockerfile"
            ".dockerignore"
            "package.json"
            "package-lock.json"
            "src/server.js"
            "src/config/db.js"
            "src/controllers/reservationController.js"
            "src/models/Hotel.js"
            "src/models/Reservation.js"
            "src/routes/reservationRoutes.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required backend file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Generate build metadata
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build-metadata

          cat > build-metadata/build-info.json <<EOF
          {
            "project": "Pipeline360-Backend",
            "commit": "${GITHUB_SHA}",
            "source_commit": "${SOURCE_COMMIT}",
            "branch": "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-metadata
          path: build-metadata/build-info.json
          if-no-files-found: error

  build-and-push:
    name: Build and push backend image
    needs:
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate backend image tag
        id: image
        run: |
          set -euo pipefail

          IMAGE_TAG="backend-${GITHUB_RUN_NUMBER}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Backend image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:${{ steps.image.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
