name: Backend Deployment Preparation

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read

env:
  INFRA_REPOSITORY: eli0504167101/Pipeline360-Infra
  BACKEND_MANIFEST: kubernetes/backend/deployment.yaml

jobs:
  update-infra:
    name: Open backend deployment pull request
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Define deployment metadata
        id: metadata
        env:
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          IMAGE_TAG="backend-${SOURCE_RUN_NUMBER}"
          BRANCH_NAME="deployment/backend-${SOURCE_RUN_ID}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          echo "Backend image tag: ${IMAGE_TAG}"
          echo "Deployment branch: ${BRANCH_NAME}"

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          fetch-depth: 0

      - name: Validate backend manifest
        run: |
          set -euo pipefail

          if [ ! -f "${BACKEND_MANIFEST}" ]; then
            echo "Backend manifest was not found: ${BACKEND_MANIFEST}"
            exit 1
          fi

          IMAGE_LINES="$(
            grep -c \
              'image: .*hotel-backend:' \
              "${BACKEND_MANIFEST}"
          )"

          if [ "${IMAGE_LINES}" -ne 1 ]; then
            echo "Expected exactly one hotel-backend image line, found: ${IMAGE_LINES}"
            exit 1
          fi

          echo "Current backend image:"
          grep -n \
            'image: .*hotel-backend:' \
            "${BACKEND_MANIFEST}"

      - name: Update backend image tag
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          sed -i \
            "s|image: .*hotel-backend:.*|image: ${DOCKERHUB_USERNAME}/hotel-backend:${IMAGE_TAG}|" \
            "${BACKEND_MANIFEST}"

          echo "Updated backend image:"
          grep -n \
            'image: .*hotel-backend:' \
            "${BACKEND_MANIFEST}"

          if ! grep -q \
            "image: ${DOCKERHUB_USERNAME}/hotel-backend:${IMAGE_TAG}" \
            "${BACKEND_MANIFEST}"; then
            echo "Backend image tag update failed."
            exit 1
          fi

      - name: Create deployment branch
        id: deployment
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${BACKEND_MANIFEST}"

          if git diff --cached --quiet; then
            echo "No backend manifest change detected."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -c "${BRANCH_NAME}"
          git commit -m "Update backend image to ${IMAGE_TAG}"
          git push --set-upstream origin "${BRANCH_NAME}"

          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request to main
        if: steps.deployment.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          EXISTING_PR="$(
            gh pr list \
              --repo "${INFRA_REPOSITORY}" \
              --base main \
              --head "${BRANCH_NAME}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${EXISTING_PR}" ]; then
            echo "Pull request #${EXISTING_PR} already exists."
            exit 0
          fi

          gh pr create \
            --repo "${INFRA_REPOSITORY}" \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Deploy backend image ${IMAGE_TAG}" \
            --body "Automated backend deployment preparation.

          - Image: \`${{ secrets.DOCKERHUB_USERNAME }}/hotel-backend:${IMAGE_TAG}\`
          - Source repository: \`${SOURCE_REPOSITORY}\`
          - Source commit: \`${SOURCE_COMMIT}\`
          - Source workflow run: ${SOURCE_RUN_URL}

          This pull request requires review and approval before merge."